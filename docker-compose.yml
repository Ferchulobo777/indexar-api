services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: indexar
      POSTGRES_USER: indexar
      POSTGRES_PASSWORD: indexar
    ports:
      - "5432:5432"
    volumes:
      - indexar-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indexar"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  indexar-db-data:
