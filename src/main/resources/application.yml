spring:
  application:
    name: indexar-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/indexar}
    username: ${DB_USER:indexar}
    password: ${DB_PASSWORD:indexar}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=5m

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

indexar:
  dolarapi:
    base-url: https://dolarapi.com/v1
